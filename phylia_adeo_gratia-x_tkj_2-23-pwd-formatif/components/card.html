<!-- Lebar kartu jika box-sizing tidak diatur: 320px + 20px + 20px + 2px + 2px = 364px -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: ghostwhite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #25395c;
            margin: 30px auto;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
        }

        .card h3 {
            color: #25395c;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
        }

        .card a {
            color: #e49141;
        }

        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="/phylia_adeo_gratia-x_tkj_2-23-pwd-formatif/assets/images/image-asset.png" alt="Gambar Proyek">
            <h3>Website Toko Online</h3>
            <p>Proyek latihan pembuatan halaman toko sederhana. Website ini dirancang menggunakan HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="">Kembali ke Beranda</a>
    </footer>
</body>
</html>
